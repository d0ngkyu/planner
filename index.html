<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플래너">
<title>플래너</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="favicon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="period">
      <button class="icon" id="prev" aria-label="이전">‹</button>
      <h1 id="label"></h1>
      <button class="icon" id="next" aria-label="다음">›</button>
      <button class="chip" id="todayBtn">오늘</button>
    </div>
    <nav class="views" id="views" role="tablist">
      <button data-view="day" role="tab">일</button>
      <button data-view="week" role="tab">주</button>
      <button data-view="month" role="tab">월</button>
      <button data-view="stats" role="tab">기록</button>
    </nav>
    <button class="me" id="meBtn" aria-label="업적">
      <span class="me-icon" id="meIcon"></span>
      <span class="me-text"><b id="meTitle"></b><small id="meLv"></small></span>
    </button>
    <div class="tools">
      <span class="sync-dot" id="syncDot" title=""></span>
      <button class="icon" id="searchBtn" aria-label="검색">⌕</button>
      <button class="icon" id="settingsBtn" aria-label="설정">⚙</button>
    </div>
  </header>
  <button class="focus-pill" id="focusPill" hidden></button>
  <main id="main"></main>
  <form class="quick-dock" id="quickDock">
    <button type="button" id="fab" class="dock-detail" aria-label="새 항목 상세 입력">＋</button>
    <div class="dock-field"><label for="dockInput" id="dockDate">오늘 할 일</label><input id="dockInput" placeholder="할 일 추가 · 14:00 회의" autocomplete="off" enterkeyhint="done" maxlength="500"></div>
    <button type="submit" class="dock-submit" aria-label="빠른 입력 추가">↑</button>
  </form>
</div>

<dialog id="editDlg" class="sheet">
  <form method="dialog" id="editForm">
    <div class="sheet-head">
      <div class="seg" id="typeSeg">
        <button type="button" data-type="task">할 일</button>
        <button type="button" data-type="event">일정</button>
      </div>
      <button type="button" class="icon" data-close aria-label="닫기">✕</button>
    </div>
    <input name="title" class="title-input" placeholder="제목" autocomplete="off" required>
    <div class="row3">
      <label>날짜<input type="date" name="date" required></label>
      <label>시작<input type="time" name="time"></label>
      <label class="endl">끝<input type="time" name="end"></label>
    </div>
    <div class="row2">
      <label class="remind">알림
        <select name="remind">
          <option value="-1">없음</option><option value="0">정시</option><option value="5">5분 전</option>
          <option value="10">10분 전</option><option value="30">30분 전</option><option value="60">1시간 전</option>
        </select>
      </label>
      <label>반복
        <select name="repeat">
          <option value="none">안 함</option><option value="daily">매일</option><option value="weekdays">평일</option>
          <option value="weekly">매주</option><option value="monthly">매월</option><option value="yearly">매년</option>
        </select>
      </label>
    </div>
    <label class="until">반복 종료일 (비우면 계속)<input type="date" name="until"></label>
    <div class="swatches" id="swatches"></div>
    <textarea name="note" rows="3" placeholder="메모"></textarea>
    <div class="task-acts" id="taskActs">
      <button type="button" id="focusBtn">⏱ 집중 시작</button>
      <button type="button" id="postponeBtn">↷ 내일로</button>
    </div>
    <div class="sheet-actions">
      <button type="button" class="danger" id="delBtn">삭제</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<dialog id="searchDlg" class="sheet">
  <div class="sheet-head"><input id="q" placeholder="할 일·일정·메모 검색" autocomplete="off"><button type="button" class="icon" data-close>✕</button></div>
  <ul id="results" class="results"></ul>
</dialog>

<dialog id="settingsDlg" class="sheet">
  <div class="sheet-head"><h2>설정</h2><button type="button" class="icon" data-close>✕</button></div>
  <section class="set">
    <h3>기기 간 동기화 <span class="status-badge" id="syncBadge">미연결</span></h3>
    <p id="syncText" class="muted"></p>
    <button id="authBtn" class="primary"></button>
  </section>
  <section class="set" id="pushSet">
    <h3>알림 <span class="status-badge" id="pushBadge">확인 중</span></h3>
    <p id="pushText" class="muted small"></p>
    <div class="row-btns"><button id="pushBtn" class="primary">이 기기에서 알림 켜기</button><button id="pingBtn">테스트 알림</button></div>
    <div class="row2 checkin">
      <label>아침 계획 알림<input type="time" id="morningAt"></label>
      <label>밤 체크 알림<input type="time" id="eveningAt"></label>
    </div>
    <label class="toggle"><input type="checkbox" id="nagOn"> 밤에 남은 할 일이 있으면 30분 간격으로 2번 더 알림</label>
    <p class="muted small" id="nagStatus" hidden>조건부 밤 재알림은 아직 연결되지 않았어요.</p>
    <p class="muted small">일정 알림은 항목마다 시간과 "알림"을 정하면 와요. 앱을 꺼 둬도 옵니다.</p>
  </section>
  <section class="set">
    <h3>화면</h3>
    <div class="seg" id="themeSeg">
      <button data-theme="system">자동</button><button data-theme="light">밝게</button><button data-theme="dark">어둡게</button>
    </div>
  </section>
  <section class="set">
    <h3>백업</h3>
    <div class="row-btns">
      <button id="exportBtn">내보내기(.json)</button>
      <label class="btn">가져오기<input type="file" id="importFile" accept="application/json" hidden></label>
    </div>
    <p class="muted small">가져오기는 기존 데이터와 합쳐집니다(같은 항목은 최신 수정본 유지).</p>
  </section>
  <p class="muted small">단축키: ←/→ 이동 · T 오늘 · D/W/M/S 보기 · N 새 항목 · / 검색</p>
</dialog>

<dialog id="achDlg" class="sheet wide">
  <div class="sheet-head"><h2>업적</h2><button type="button" class="icon" data-close>✕</button></div>
  <div id="achBody"></div>
</dialog>

<dialog id="celebDlg" class="sheet celeb">
  <div id="celebBody"></div>
  <div class="sheet-actions"><button type="button" id="celebMore">업적 보기</button><button type="button" class="primary" data-close>좋아요</button></div>
</dialog>

<dialog id="routineDlg" class="sheet">
  <div class="sheet-head"><h2>루틴</h2><button type="button" class="icon" data-close>✕</button></div>
  <div id="routineBody"></div>
</dialog>

<dialog id="focusDlg" class="sheet focus">
  <div class="sheet-head"><span class="muted small">집중 타이머</span><button type="button" class="icon" data-close aria-label="작게 보기">⌄</button></div>
  <div id="focusBody"></div>
</dialog>

<div id="fx" class="fx" aria-hidden="true"></div>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
